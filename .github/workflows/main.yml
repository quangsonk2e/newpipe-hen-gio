name: Build NewPipe Hen Gio - APK va Ma Nguon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 1. Lay tep ma sua tu kho cua ban
        uses: actions/checkout@v4

      - name: 2. Tai toan bo ma nguon NewPipe v0.29.1
        run: |
          git clone --branch v0.29.1 --depth 1 https://github.com/TeamNewPipe/NewPipe.git NewPipe
          echo "Commit goc: $(git -C NewPipe rev-parse HEAD)"
          test "$(git -C NewPipe rev-parse --short=7 HEAD)" = "00acf2f"

      - name: 3. Cai dat Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 4. Cai dat cong cu Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 5. Them tinh nang hen gio tat
        run: |
          python3 -m py_compile apply_sleep_timer.py
          python3 apply_sleep_timer.py NewPipe
          git -C NewPipe diff --check

      - name: 6. Dong goi TOAN BO ma nguon da them hen gio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          src = Path('NewPipe')
          out = Path('NewPipe_v0.29.1_HenGio_FULL_SOURCE.zip')
          skip = {'.git', '.gradle', '.idea', 'build', '__pycache__'}
          with ZipFile(out, 'w', compression=ZIP_DEFLATED, compresslevel=6) as z:
              for file in src.rglob('*'):
                  if file.is_file() and not set(file.relative_to(src).parts).intersection(skip):
                      z.write(file, 'NewPipe-v0.29.1-HenGio/' + file.relative_to(src).as_posix())
          print('Da tao', out, out.stat().st_size, 'bytes')
          PY

      - name: 7. Bien dich APK
        working-directory: NewPipe
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 8. Hien thi APK va kiem tra ma bam
        run: |
          ls -lah NewPipe/app/build/outputs/apk/debug/
          sha256sum NewPipe/app/build/outputs/apk/debug/*.apk

      - name: 9. Xuat file APK cho ban tai
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-v0.29.1-HenGio-APK
          path: NewPipe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 10. Xuat TOAN BO ma nguon da sua (ke ca khi build loi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-v0.29.1-HenGio-FULL-SOURCE
          path: NewPipe_v0.29.1_HenGio_FULL_SOURCE.zip
          if-no-files-found: warn
          retention-days: 14
