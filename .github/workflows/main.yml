name: Build NewPipe - Local Tab + Hen Gio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'apply_sleep_timer.py'
      - 'apply_local_media.py'
      - 'features/local_media/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 1. Lay ma nguon tuy bien tu repository
        uses: actions/checkout@v4

      - name: 2. Tai NewPipe chuan v0.29.1
        run: |
          git clone --branch v0.29.1 --depth 1 https://github.com/TeamNewPipe/NewPipe.git NewPipe
          echo "Upstream commit: $(git -C NewPipe rev-parse HEAD)"
          test "$(git -C NewPipe rev-parse --short=7 HEAD)" = "00acf2f"

      - name: 3. Chuan bi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 4. Chuan bi Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 5. Ap dung chuc nang hen gio da co
        run: |
          python3 -m py_compile apply_sleep_timer.py
          python3 apply_sleep_timer.py NewPipe

      - name: 6. Them thu vien nhac va video trong dien thoai
        run: |
          python3 -m py_compile apply_local_media.py
          python3 apply_local_media.py NewPipe

      - name: 7. Kiem tra manifest va XML giao dien
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          source = Path('NewPipe/app/src/main')
          for file in [source / 'AndroidManifest.xml',
                       source / 'res/layout/activity_local_media.xml',
                       source / 'res/layout/activity_local_media_host.xml',
                       source / 'res/layout/row_local_media.xml',
                       source / 'res/layout/activity_local_media_player.xml',
                       source / 'res/values/strings.xml',
                       source / 'res/values-vi/strings.xml']:
              ET.parse(file)
              print('XML OK:', file)
          PY
          git -C NewPipe diff --check
          python3 scripts/verify_local_tab.py NewPipe

      - name: 7b. Su dung khoa ky debug co dinh neu da cai GitHub Secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Stable signing key restored (not printed)."
          else
            echo "No stable signing key: GitHub will use its temporary debug key."
          fi

      - name: 8. Bien dich APK debug (sua Gradle cache / ktlint / loi mang 504)
        working-directory: NewPipe
        shell: bash
        run: |
          chmod +x ./gradlew
          # NewPipe v0.29.1 bat configuration cache, trong khi formatKtlint
          # co the loi khi serialization. Chi bo qua cac tac vu lint khi tao APK.
          # Java/Kotlin/Android resources van duoc bien dich day du.
          build_args=(
            :app:assembleDebug
            --no-daemon
            --no-configuration-cache
            --stacktrace
            --console=plain
            -DskipFormatKtlint=true
            -x :app:formatKtlint
            -x :app:runKtlint
            -x :app:runCheckstyle
          )
          for attempt in 1 2; do
            echo "=== APK build attempt ${attempt}/2 ==="
            if ./gradlew "${build_args[@]}"; then
              echo "APK build completed successfully."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Build failed. Retrying once in case dependency download returned 5xx/timeout."
              sleep 20
            fi
          done
          echo "APK build failed twice. Inspect the FIRST 'What went wrong' and 'Caused by' lines above."
          exit 1

      - name: 9. Thong tin APK va SHA-256
        run: |
          ls -lah NewPipe/app/build/outputs/apk/debug/
          sha256sum NewPipe/app/build/outputs/apk/debug/*.apk

      - name: 10. Tai APK ve dien thoai
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-v0.29.1-HenGio-LocalTab-APK
          path: NewPipe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 11. Dong goi ma nguon da chinh sua
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          src = Path('NewPipe')
          out = Path('NewPipe_v0.29.1_HenGio_LocalTab_FULL_SOURCE.zip')
          skip = {'.git', '.gradle', '.idea', 'build', '__pycache__'}
          if src.is_dir():
              with ZipFile(out, 'w', compression=ZIP_DEFLATED, compresslevel=6) as z:
                  for file in src.rglob('*'):
                      if file.is_file() and not set(file.relative_to(src).parts).intersection(skip):
                          z.write(file, 'NewPipe-HenGio-LocalTab/'
                                  + file.relative_to(src).as_posix())
              print('Created:', out, out.stat().st_size, 'bytes')
          PY

      - name: 12. Tai ma nguon da sua (ke ca khi build loi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-v0.29.1-HenGio-LocalTab-FULL-SOURCE
          path: NewPipe_v0.29.1_HenGio_LocalTab_FULL_SOURCE.zip
          if-no-files-found: warn
          retention-days: 14
